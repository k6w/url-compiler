<text x="468" y="66" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">2 bits family, 6 bits version</text>
<text x="468" y="84" fill="#8d92a3" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">— an old link never becomes ambiguous</text>
