<text x="80" y="430" fill="#8d92a3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">bit 2</text>
<text x="138" y="430" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">credentials present</text>
<text x="80" y="452" fill="#8d92a3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">bit 3</text>
