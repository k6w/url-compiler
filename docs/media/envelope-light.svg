<text x="138" y="496" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">dictionary-version varint follows</text>
<text x="80" y="518" fill="#8d92a3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">bit 6</text>
<text x="138" y="518" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">checksum present (reserved)</text>
<text x="80" y="540" fill="#8d92a3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">bit 7</text>
<text x="138" y="540" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">encryption present (rejected on decode)</text>
<text x="620" y="300" fill="#5b6072" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" text-anchor="start" letter-spacing="1.6">THEN, IN ORDER</text>
<rect x="620" y="320" width="500" height="48" rx="5" fill="#fbfaf6" stroke="#d9d4c6"/>
<text x="634" y="340" fill="#1a1c24" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="start">[dict version varint]</text>
<text x="634" y="357" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">only when bit 5 is set</text>
<rect x="620" y="382" width="500" height="48" rx="5" fill="#fbfaf6" stroke="#d9d4c6"/>
<text x="634" y="402" fill="#1a1c24" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="start">[instruction stream]</text>
<text x="634" y="419" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">byte-aligned (v0) or MSB-first bit-packed (v1)</text>
<line x1="620" y1="456" x2="1120" y2="456" stroke="#d9d4c6" stroke-width="1"/>
<text x="620" y="482" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Varints are LEB128, ≤5 bytes, minimal — overlong encodings are rejected.</text>
<text x="620" y="504" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Every read is bounds-checked; truncated streams fail closed.</text>
<text x="620" y="526" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Decompression is capped at 64 KiB, so a zip bomb cannot land.</text>
</svg>