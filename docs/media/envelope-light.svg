<text x="124" y="152" fill="#1a1c24" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start">Brotli-compressed canonical</text>
<text x="420" y="152" fill="#5b6072" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">v0 plain · v1 shared dictionary</text>
